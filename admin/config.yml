backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "CMS 建立 {{collection}}：{{slug}}"
    update: "CMS 更新 {{collection}}：{{slug}}"
    delete: "CMS 刪除 {{collection}}：{{slug}}"

media_folder: "assets/garden"
public_folder: "/assets/garden"
site_url: "https://meiyuan6.tw"
display_url: "https://meiyuan6.tw"
logo_url: "/assets/brand/logo-icon.png"
locale: "zh_Hant"
publish_mode: editorial_workflow
show_preview_links: true

collections:
  - name: settings
    label: 網站設定
    files:
      - name: hero
        label: 首頁主視覺
        file: data/hero.json
        format: json
        fields:
          - {label: 英文眉標, name: kicker, widget: string}
          - {label: 主標題, name: title, widget: string}
          - {label: 副標題, name: subtitle, widget: string}
          - {label: 主視覺文案, name: description, widget: text}
          - label: 輪播照片
            name: slides
            widget: list
            fields:
              - {label: 照片, name: image, widget: image}
              - {label: 替代文字, name: alt, widget: string}
      - name: site
        label: 聯絡資訊
        file: data/site.json
        format: json
        fields:
          - {label: 網站名稱, name: site_name, widget: string}
          - {label: 品牌標語, name: tagline, widget: string}
          - {label: 電話顯示, name: phone_display, widget: string}
          - {label: 電話連結, name: phone_link, widget: string}
          - {label: LINE 連結, name: line_url, widget: string}
          - {label: Facebook 連結, name: facebook_url, widget: string}
          - {label: 電子郵件, name: email, widget: string, required: false}
          - {label: 公開電子郵件, name: show_email, widget: boolean, default: false}
          - {label: 地址, name: address, widget: string}
          - {label: Google Maps 連結, name: map_url, widget: string}
          - {label: 版權文字, name: copyright, widget: string}
      - name: seo
        label: SEO 設定
        file: data/seo.json
        format: json
        fields:
          - {label: SEO 標題, name: title, widget: string}
          - {label: SEO 說明, name: description, widget: text}
          - {label: 關鍵字, name: keywords, widget: string}
          - {label: Canonical URL, name: canonical, widget: string}
          - {label: 社群分享圖片, name: og_image, widget: image}
      - name: rooms
        label: 房型管理
        file: data/rooms.json
        format: json
        fields:
          - label: 房型
            name: rooms
            widget: list
            fields:
              - {label: 顯示, name: enabled, widget: boolean, default: true}
              - {label: 房型名稱, name: name, widget: string}
              - {label: 入住人數, name: capacity, widget: string}
              - {label: 特色標籤, name: tags, widget: list}
              - {label: 介紹, name: description, widget: text}
              - {label: 照片, name: image, widget: image}
              - {label: 圖片說明, name: alt, widget: string}
      - name: facilities
        label: 館內設施
        file: data/facilities.json
        format: json
        fields:
          - label: 設施群組
            name: groups
            widget: list
            fields:
              - {label: 顯示, name: enabled, widget: boolean, default: true}
              - {label: 圖示, name: icon, widget: string}
              - {label: 名稱, name: name, widget: string}
              - {label: 說明, name: description, widget: text}
              - {label: 設施項目, name: items, widget: list}
      - name: attractions
        label: 周邊景點
        file: data/attractions.json
        format: json
        fields:
          - label: 景點
            name: attractions
            widget: list
            fields:
              - {label: 顯示, name: enabled, widget: boolean, default: true}
              - {label: 景點名稱, name: name, widget: string}
              - {label: 車程, name: travel_time, widget: string}
              - {label: 介紹, name: description, widget: text}
              - {label: 照片, name: image, widget: image}
              - {label: Google Maps, name: map_url, widget: string}
      - name: policies
        label: 入住須知與訂房政策
        file: data/policies.json
        format: json
        fields:
          - label: 規範項目
            name: items
            widget: list
            fields:
              - {label: 顯示, name: enabled, widget: boolean, default: true}
              - {label: 分類, name: category, widget: select, options: [住宿須知, 訂房政策]}
              - {label: 標題, name: title, widget: string}
              - {label: 內容, name: content, widget: text}
      - name: faq
        label: 常見問題
        file: data/faq.json
        format: json
        fields:
          - label: 問答
            name: items
            widget: list
            fields:
              - {label: 顯示, name: enabled, widget: boolean, default: true}
              - {label: 問題, name: question, widget: string}
              - {label: 回答, name: answer, widget: text}
  - name: news
    label: 最新消息／優惠活動
    files:
      - name: news_items
        label: 消息與優惠
        file: data/news.json
        format: json
        fields:
          - label: 項目
            name: items
            widget: list
            fields:
              - {label: 發布, name: published, widget: boolean, default: true}
              - {label: 置頂, name: featured, widget: boolean, default: false}
              - {label: 標題, name: title, widget: string}
              - {label: 日期, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false}
              - {label: 摘要, name: summary, widget: text}
              - {label: 內容, name: body, widget: markdown}
              - {label: 封面照片, name: cover, widget: image}
  - name: blog
    label: 部落格文章
    files:
      - name: blog_items
        label: 文章
        file: data/blog.json
        format: json
        fields:
          - label: 文章項目
            name: items
            widget: list
            fields:
              - {label: 發布, name: published, widget: boolean, default: true}
              - {label: 標題, name: title, widget: string}
              - {label: 日期, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false}
              - {label: 作者, name: author, widget: string}
              - {label: 摘要, name: summary, widget: text}
              - {label: 內容, name: body, widget: markdown}
              - {label: 封面照片, name: cover, widget: image}
